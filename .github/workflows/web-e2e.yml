name: Web E2E

"on":
  push:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/web-e2e.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/web-e2e.yml"

# Concurrency: cancel in-flight runs on the same ref so a follow-up
# push doesn't keep an obsolete build alive.
concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      # Install only what's needed for the E2E suite: a chromium
      # browser, the web app's dev deps, and a prebuilt API binary.
      # We don't `npm ci` against the full monorepo because the web
      # app's package.json is self-contained.
      - name: Install web dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build API binary
        working-directory: apps/api
        run: |
          go build -tags fts5 -trimpath -ldflags="-s -w" -o bin/server ./cmd/server

      # Build the Next.js app once and run `next start` against the
      # static build. This is what production looks like and avoids
      # the dev-server hot-reload overhead in CI.
      - name: Build web app
        run: npm run build

      # Pre-build makes the Playwright run significantly faster and
      # deterministic. The webServer in playwright.config.ts will
      # still start the binary, but it now points at an already-built
      # app.
      - name: Run Playwright tests
        run: npx playwright test --reporter=line

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/e2e/.results
          retention-days: 7
          if-no-files-found: ignore
