name: CI

# Top-level monorepo CI. Runs the full backend test suite, formatting /
# vet checks, the frontend type-check + production build, and the
# docker compose build (verifies both Dockerfiles still work). Jobs run
# in parallel where possible; only `docker-build` waits on `backend-test`
# + `frontend-build` so a failing test fails fast without burning CPU on
# a multi-stage docker build.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs on the same ref so a follow-up push doesn't keep
# an obsolete build alive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin tool versions in one place. go.mod declares `go 1.25.0` and the
# upstream Dockerfile is being upgraded to match; CI uses 1.25 today so
# the `go.mod` toolchain directive resolves cleanly. Node 20 matches
# `node:20-alpine` in apps/web/Dockerfile.
env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------
  # backend-test
  # ------------------------------------------------------------------
  # The documented review command is `go test -race ./...`. We run it
  # twice: once with the `fts5` build tag (full suite incl. FTS5
  # integration tests) and once without (verifies the FTS5-gated tests
  # are skipped, not failed, when the tag is absent).
  # ------------------------------------------------------------------
  backend-test:
    name: Backend tests (race + fts5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Test with -race -tags fts5
        run: go test -race -tags fts5 ./...

      - name: Test with -race (no fts5 tag)
        run: go test -race ./...

  # ------------------------------------------------------------------
  # backend-vet — go vet + gofmt check
  # ------------------------------------------------------------------
  backend-vet:
    name: Backend vet + gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: go vet (with fts5 tag)
        run: go vet -tags fts5 ./...

      # gofmt -l prints any file that would be reformatted. Fail the
      # job if the list is non-empty.
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # ------------------------------------------------------------------
  # frontend-build — tsc + next build
  # ------------------------------------------------------------------
  # Lint is invoked via `next lint`, which currently warns about
  # missing config in fresh Next 14 setups; we run it with --no-cache
  # so warnings still surface but don't fail the job (next lint
  # returns 0 on warnings). Type-check (`tsc --noEmit`) is the
  # authoritative gate.
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend build (tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit --pretty false

      - name: Lint (next lint, non-blocking warnings)
        run: npx next lint --max-warnings=999 || true

      - name: Production build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ------------------------------------------------------------------
  # docker-build — verify both Dockerfiles still build under compose.
  # ------------------------------------------------------------------
  # This is intentionally a *build* only (no `up`). It catches Docker
  # regressions (missing files, wrong base image, broken multi-stage
  # cache) without paying the cost of starting the stack. We wait for
  # backend-test + frontend-build so a fundamental compile/test break
  # fails fast.
  # ------------------------------------------------------------------
  docker-build:
    name: Docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Use GHA cache for the docker layer cache. Cuts cold-build
      # time roughly in half on the second run.
      - name: Expose GitHub Actions runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: docker compose build
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: docker compose build --progress=plain
