name: CI

# Top-level monorepo CI. Runs the full backend test suite, formatting /
# vet checks, the frontend type-check + production build, and the
# docker compose build (verifies both Dockerfiles still work). Jobs run
# in parallel where possible; only `docker-build` waits on `backend-test`
# + `frontend-build` so a failing test fails fast without burning CPU on
# a multi-stage docker build.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs on the same ref so a follow-up push doesn't keep
# an obsolete build alive.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pin tool versions in one place. go.mod declares `go 1.25.0` and the
# upstream Dockerfile is being upgraded to match; CI uses 1.25 today so
# the `go.mod` toolchain directive resolves cleanly. Node 20 matches
# `node:20-alpine` in apps/web/Dockerfile.
env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------
  # backend-test
  # ------------------------------------------------------------------
  # The documented review command is `go test -race ./...`. We run it
  # twice: once with the `fts5` build tag (full suite incl. FTS5
  # integration tests) and once without (verifies the FTS5-gated tests
  # are skipped, not failed, when the tag is absent).
  # ------------------------------------------------------------------
  backend-test:
    name: Backend tests (race + fts5)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Test with -race -tags fts5
        run: go test -race -tags fts5 ./...

      - name: Test with -race (no fts5 tag)
        run: go test -race ./...

  # ------------------------------------------------------------------
  # backend-vet — go vet + gofmt check
  # ------------------------------------------------------------------
  backend-vet:
    name: Backend vet + gofmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: go vet (with fts5 tag)
        run: go vet -tags fts5 ./...

      # gofmt -l prints any file that would be reformatted. Fail the
      # job if the list is non-empty.
      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # ------------------------------------------------------------------
  # frontend-build — tsc + next build
  # ------------------------------------------------------------------
  # Lint is invoked via `next lint`, which currently warns about
  # missing config in fresh Next 14 setups; we run it with --no-cache
  # so warnings still surface but don't fail the job (next lint
  # returns 0 on warnings). Type-check (`tsc --noEmit`) is the
  # authoritative gate.
  # ------------------------------------------------------------------
  frontend-build:
    name: Frontend build (tsc + next build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit --pretty false

      - name: Lint (next lint, non-blocking warnings)
        run: npx next lint --max-warnings=999 || true

      - name: Production build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ------------------------------------------------------------------
  # docker-build — verify both Dockerfiles still build under compose.
  # ------------------------------------------------------------------
  # This is intentionally a *build* only (no `up`). It catches Docker
  # regressions (missing files, wrong base image, broken multi-stage
  # cache) without paying the cost of starting the stack. We wait for
  # backend-test + frontend-build so a fundamental compile/test break
  # fails fast.
  # ------------------------------------------------------------------
  docker-build:
    name: Docker compose build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Use GHA cache for the docker layer cache. Cuts cold-build
      # time roughly in half on the second run.
      - name: Expose GitHub Actions runtime to buildx
        uses: crazy-max/ghaction-github-runtime@v3

      - name: docker compose build
        env:
          DOCKER_BUILDKIT: "1"
          COMPOSE_DOCKER_CLI_BUILD: "1"
        run: docker compose build --progress=plain

  # ------------------------------------------------------------------
  # loadtest — exercise the API with k6 against a freshly-built
  # binary and assert on the SLOs from the Phase 1.5 spec.
  # ------------------------------------------------------------------
  # We do not run a k6 job in parallel with docker-build because the
  # load test is the longest single job in the pipeline (~100s) and
  # burning it on a docker regression is wasteful. The job boots the
  # API from a freshly-built binary on a temp SQLite path, waits for
  # /healthz to return 200, runs k6 via the official container
  # image (no system k6 install needed), and tears the server down.
  # ------------------------------------------------------------------
  loadtest:
    name: Load test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/api/go.sum

      - name: Build API binary
        working-directory: apps/api
        run: |
          mkdir -p ../bin
          go build -tags fts5 -trimpath -o ../bin/opc-api ./cmd/server

      # Boot the API on an ephemeral port with a temp DB. The
      # `&` backgrounds the process; the `pid` file is used for
      # the teardown step so we don't rely on pgrep heuristics.
      - name: Start API server
        working-directory: apps/api
        env:
          # Use a non-default port to avoid clashing with any
          # other listener on the runner image.
          PORT: "48080"
          DB_PATH: "${{ runner.temp }}/opc-loadtest.db"
          LOG_LEVEL: "warn"
          # Empty key — /ai/topics is expected to 503 fast; the
          # k6 thresholds are scoped to latency, not status.
          ANTHROPIC_API_KEY: ""
        run: |
          rm -f "$DB_PATH"
          ../bin/opc-api &
          echo $! > api.pid

      - name: Wait for /healthz
        run: |
          # Poll /healthz for up to 30s. Fail the job if the
          # server never becomes reachable — that's a real bug
          # we want CI to surface, not paper over with a longer
          # timeout.
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:48080/healthz || true)
            if [ "$status" = "200" ]; then
              echo "API healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy within 30s"
          exit 1

      # The official k6 image ships with the xk6-output-json
      # extension already available. We mount the repo so the
      # script can read apps/loadtest/k6-basic.js, and emit a
      # JSON summary that operators can download as an artifact.
      - name: Run k6
        run: |
          docker run --rm --network host \
            -v "${{ github.workspace }}:/scripts:ro" \
            -v "${{ runner.temp }}/k6-summary:/summary" \
            -w /scripts \
            grafana/k6:latest run \
              --summary-export=/summary/loadtest-summary.json \
              -e BASE_URL=http://localhost:48080 \
              apps/loadtest/k6-basic.js

      # Best-effort teardown — kill the API even if k6 failed
      # so the runner doesn't leak the process. `kill -0`
      # confirms the pid is still ours before sending SIGTERM.
      - name: Teardown API server
        if: always()
        working-directory: apps/api
        run: |
          if [ -f api.pid ]; then
            pid=$(cat api.pid)
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
            rm -f api.pid
          fi

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-loadtest-summary
          path: ${{ runner.temp }}/k6-summary/loadtest-summary.json
          if-no-files-found: warn
