name: Release

# Build and (optionally) push the API + Web Docker images to GHCR on a
# `v*` tag push. We always *build* the images so the tag is a real
# build gate. Push is conditional on the repository having
# `GHCR_TOKEN` configured (or the workflow being run with
# `packages: write`); when no credentials are available the job logs
# what *would* have been pushed and exits successfully so the tag
# itself is still a green check.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (defaults to GITHUB_REF_NAME)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Resolve the version once. Strips a leading `v` so the image
      # tag is `0.1.0`, not `v0.1.0`, matching docker convention.
      - name: Resolve version
        id: version
        run: |
          raw="${{ github.event.inputs.tag }}"
          if [ -z "$raw" ]; then raw="${GITHUB_REF_NAME}"; fi
          version="${raw#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "raw=$raw" >> "$GITHUB_OUTPUT"
          echo "Building version: $version (from tag $raw)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login is best-effort: on a fork or a repo without packages:
      # write the step still completes (continue-on-error) and the
      # push step downgrades to a dry-run.
      - name: Log in to GHCR
        id: login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image refs
        id: refs
        run: |
          owner_lc="$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')"
          api_image="${{ env.REGISTRY }}/${owner_lc}/opc-api"
          web_image="${{ env.REGISTRY }}/${owner_lc}/opc-web"
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "web_image=$web_image" >> "$GITHUB_OUTPUT"

      # ---- API image ----
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          file: apps/api/Dockerfile
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ steps.refs.outputs.api_image }}:${{ steps.version.outputs.version }}
            ${{ steps.refs.outputs.api_image }}:latest
          cache-from: type=gha,scope=opc-api
          cache-to: type=gha,scope=opc-api,mode=max

      # ---- Web image ----
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ steps.refs.outputs.web_image }}:${{ steps.version.outputs.version }}
            ${{ steps.refs.outputs.web_image }}:latest
          cache-from: type=gha,scope=opc-web
          cache-to: type=gha,scope=opc-web,mode=max

      - name: Summary
        run: |
          {
            echo "### Release ${{ steps.version.outputs.raw }}"
            echo ""
            if [ "${{ steps.login.outcome }}" = "success" ]; then
              echo "Pushed images:"
            else
              echo "GHCR login failed or unavailable — images were built but **not pushed**."
              echo "Would have pushed:"
            fi
            echo "- \`${{ steps.refs.outputs.api_image }}:${{ steps.version.outputs.version }}\`"
            echo "- \`${{ steps.refs.outputs.api_image }}:latest\`"
            echo "- \`${{ steps.refs.outputs.web_image }}:${{ steps.version.outputs.version }}\`"
            echo "- \`${{ steps.refs.outputs.web_image }}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
