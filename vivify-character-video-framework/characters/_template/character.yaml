# character.yaml — multi-IP template (generated by `vivify character new`)
#
# When you run `vivify character new <name>`, the generator fills in
# the {{...}} placeholders below using your 5 answers. You can then
# edit the file further to tune outfits, scenes, voice profiles.
#
# See characters/fengge/character.yaml for a fully-filled example
# (5 outfits, 12 scenes, 4-tone voice matrix).
# See docs/adding-new-character.md for the full onboarding walkthrough.
#
# ──────────────────────────────────────────────────────────────────
# The 5 questions the generator will ask you:
#   1. Species         → {{species}}             (e.g. "成年熊猫", "小猫", "小男孩")
#   2. Primary palette → {{palette_primary}}     (hex without #, e.g. "C73E1D")
#                        {{palette_secondary}}   (hex without #, e.g. "F5F0E1")
#   3. Personality     → {{personality_1}}, {{personality_2}}, {{personality_3}}
#                        (3 short tags, e.g. "内敛", "幽默", "治愈")
#   4. Default scenes  → {{scenes}}              (3-5 scene tags, comma-separated)
#   5. Default tone    → {{default_voice}}       (国潮 / 治愈 / 哲学 / 御宅)
# ──────────────────────────────────────────────────────────────────

character:
  # Display name (Chinese)
  name: "{{name}}"
  # Display name (English / Pinyin)
  english_name: "{{english_name}}"
  # Species — answer to question 1
  species: "{{species}}"
  # Build proportions: 头身比 = head:body ratio (1:1.2 means head = body/1.2)
  head_body_ratio: "1:1.2"
  # Fur / surface colors (RGB hex without #) — face/torso and extremities
  # Filled from question 2 (primary + a complementary secondary)
  fur_face: "{{palette_primary}}"       # dominant color
  fur_extremity: "{{palette_secondary}}"  # accent / limbs
  # Signature expression register (auto-generated from personality tags)
  expression: "{{expression_default}}"

  # ── Canonical reference images (Seedream reference_image for identity) ──
  # CRITICAL: drop 3 jpgs into ./canonical/ AFTER generating this file.
  # The close-up face shot MUST be a separate file from the full-body shot
  # (avoids ID drift — see characters/fengge/lessons.md).
  canonical:
    # Default anchor — used as the reference_image for every shot
    primary: "canonical/primary.jpg"
    # Alternates (different outfits, same neutral pose)
    alternates:
      - "canonical/alternate-1.jpg"
      - "canonical/alternate-2.jpg"

  # ── Outfit whitelist (3 default — IP-dependent) ──
  # Each anti_patterns MUST contain ≥2 negative tokens. Validated by
  # validators/lint_constraints.py. The 3 outfits below use 传统 / 日常 / IP-specific
  # as a generic template — replace with what fits your IP.
  outfits:
    - id: outfit_traditional
      name: "传统服饰"
      color: "{{palette_primary}}"
      description: "traditional outfit (replace with your IP's signature look)"
      best_for: ["国潮", "哲学"]
      anti_patterns: |
        no modern elements (no plastic, no synthetic fabric, no zipper);
        no Western cut (no lapel, no collar stay, no shoulder pads);
        no movie-cosplay exaggeration (no anime hair, no armor plates);
        traditional mandarin collar, simple cotton/linen, classical patterns only

    - id: outfit_daily
      name: "日常穿搭"
      color: "{{palette_secondary}}"
      description: "everyday casual wear suitable for neutral scenes"
      best_for: ["治愈", "御宅"]
      anti_patterns: |
        no formal wear (no business suit, no tie, no tuxedo);
        no sportswear (no athletic jersey, no team logos, no reflective stripes);
        no flashy accessories (no luxury watches, no large jewelry, no sunglasses);
        simple cotton, muted palette, minimal seam only

    - id: outfit_signature
      name: "IP 招牌造型"
      color: "{{palette_primary}} + {{palette_secondary}}"
      description: "the IP's signature look — what fans instantly recognize"
      best_for: ["国潮", "治愈", "哲学", "御宅"]
      anti_patterns: |
        no generic mascot (no clipart, no emoji-style, no Pixar toy);
        no off-brand reskin (no imported cartoon template, no cosplay armor);
        no character-costume exaggeration (no wings, no halo, no cape);
        IP-faithful, brand-locked, in-universe only

  # ── Scene whitelist (5 default, generated from answer 4) ──
  # Replace with scenes that fit your IP's world.
  scenes:
    - id: scene_default_1
      name: "{{scenes_split_0}}"
      mood: "warm, intimate"
    - id: scene_default_2
      name: "{{scenes_split_1}}"
      mood: "calm, focused"
    - id: scene_default_3
      name: "{{scenes_split_2}}"
      mood: "lively, festive"
    - id: scene_default_4
      name: "{{scenes_split_3}}"
      mood: "contemplative, quiet"
    - id: scene_default_5
      name: "{{scenes_split_4}}"
      mood: "nocturnal, intimate"

  # ── Forbidden scenes / poses ──
  # Customize to your IP — this is the generic safe default.
  forbidden:
    scenes:
      - "现代写字楼"
      - "夜店"
      - "健身房"
    poses:
      - "攻击性姿势"
      - "卖惨流泪"

  # ── Prop whitelist (replace with IP-appropriate props) ──
  props:
    - 折扇
    - 茶盏
    - 古书
    - 樱花
    - 油纸伞

  # ── 4-tone voice matrix (TTS profile per tone) ──
  # tone → TTS profile (海螺 MiniMax speech-02-hd).
  # The 4 standard tones (国潮/治愈/哲学/御宅) are pre-filled; you can
  # adjust voice_id per IP, but keep the tone keys for pipeline compat.
  voice_profiles:
    治愈:
      voice_id: "male-qn-jingying"
      speed: 0.78
      pitch: -2
      emotion: "neutral"
      vol: 1.0
      guide: "治愈调: 慢、暖、留白。句子要短,带'嘿'/'啊'/'嗯...'的停顿。画面给暖光 + 茶烟 + 雨声。结尾允许悬而未决,但要给观众一个可以'靠'着的具体物(茶盏/毛毯/雨声)。"
    御宅:
      voice_id: "male-qn-jingying"
      speed: 0.85
      pitch: -1
      emotion: "neutral"
      vol: 0.95
      guide: "御宅调: 内向、独处、书斋感。'我也不爱出门'/'那就一起待着'。画面给室内小景 + 毛绒毯 + 深夜台灯。少修饰,多停顿。"
    哲学:
      voice_id: "male-qn-qingse"
      speed: 0.82
      pitch: -3
      emotion: "sad"
      vol: 1.0
      guide: "哲学调: 反鸡汤、存在主义。'但真的是这样吗?' 提问不答。画面给月下 + 山水 + 远景。多用问句,少给结论。"
    国潮:
      voice_id: "male-qn-jingying"
      speed: 0.92
      pitch: 0
      emotion: "neutral"
      vol: 1.05
      guide: "国潮调: 古诗、传统美学、节气时令。'古人云'/'你看那山'。画面给折扇 + 卷轴 + 红叶 + 樱花。可引《庄子》/《诗经》/唐诗,1 句即可。"

  # ── Style anchor — appended to every Seedream prompt to lock visual register ──
  # Strong positive anchors FIRST (priority), then strong negative anchors at
  # the end (Seedream weights later tokens less, so negatives must be
  # unambiguous and aggressive). Tune this to your IP's visual direction.
  style_anchor: |
    2D flat illustration, gouache paint, paper texture,
    cel-shaded (no gradient lighting, no soft 3D shadows),
    simplified shapes, anime-influenced lineart,
    brush stroke ink outlines, children's book illustration style,
    watercolor wash + ink accents,
    vibrant saturated palette ({{palette_primary}} + {{palette_secondary}} + complementary),
    ALWAYS 2D FLAT NEVER 3D NEVER PHOTOREALISTIC,
    NEVER PIXAR NEVER DISNEY NEVER CG RENDERED TOY,
    NEVER BLURRY NEVER DARK NEVER MUTED DESATURATED

  # ── Hook formulas for opening lines (optional but useful) ──
  # Replace with IP-specific hook patterns. fengge's 7 patterns are a
  # solid starting reference; copy what fits, drop what doesn't.
  hook_formulas:
    - name: "三问开场"
      formula: '"你有没有想过——X 到底是什么?Y 真的重要吗?凭什么 Z?"'
    - name: "反常识开场"
      formula: '"X 的人都错了,真正应该 Y"'
    - name: "留白钩子"
      formula: '"[pause 2s] 今天不聊 X,聊 Y"'
    - name: "故事钩子"
      formula: '"昨天发生了一件事,让我想了 3 天"'
    - name: "画面钩子"
      formula: "直接给一个具体画面,旁白 1 句话"
    - name: "引用钩子"
      formula: "用经典文本/古文开场,1 句即可"
    - name: "数字钩子"
      formula: '"我花了 N 天/M 块钱,发现 XX"'

  # ── Voice rules (sentence style + banned words) ──
  # Defaults reflect the 3 personality tags (question 3).
  voice_rules:
    sentence_style:
      - "短句 ≤15 字"
      - "多用反问('你说,这是不是有点奇怪?')"
      - "大量留白(段间停顿 1-2 秒)"
    signature_words:
      - "嘿"
      - "啊"
      - "得"
      - "呗"
    banned_words:
      - "加油"
      - "失败是成功之母"
      - "你一定可以"

# ──────────────────────────────────────────────────────────────────
# Generator metadata (do not edit manually unless you know what you're doing)
# ──────────────────────────────────────────────────────────────────
_generated:
  by: "vivify character new"
  version: "0.1.0"
  idempotency_seed: "{{idempotency_seed}}"
  default_voice: "{{default_voice}}"
  personality_tags:
    - "{{personality_1}}"
    - "{{personality_2}}"
    - "{{personality_3}}"
