version: '3.8'

services:
  api:
    build: ./apps/api
    ports:
      - "8080:8080"
    environment:
      - DB_PATH=/data/opc.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - opc-data:/data
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api
    restart: unless-stopped

volumes:
  opc-data:
