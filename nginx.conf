# ============================================================================
# OPC — Nginx reverse proxy
# ----------------------------------------------------------------------------
# This file is intended to be mounted at /etc/nginx/nginx.conf (or included
# from there) on the VPS that hosts the production stack.
#
# It terminates plain HTTP and is HTTPS-ready. The TLS server block is
# commented out — uncomment it after you have:
#   1) Pointed a DNS A/AAAA record for opc.example.com at this host
#   2) Issued a cert (e.g. `certbot certonly --nginx -d opc.example.com`)
#   3) Reloaded nginx
#
# Quick test (HTTP only):
#   sudo cp nginx.conf /etc/nginx/nginx.conf
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

user                 www-data;
worker_processes     auto;
pid                  /run/nginx.pid;
error_log            /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # ---- Basics -----------------------------------------------------------
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;
    server_tokens       off;

    # ---- Logging ----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    # ---- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ---- Upstreams --------------------------------------------------------
    # The docker compose stack publishes API on 127.0.0.1:8080 and web on
    # 127.0.0.1:3000. We proxy to those loopback addresses.
    upstream opc_api {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    upstream opc_web {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # ---- Security headers (applied to all responses) ---------------------
    add_header X-Content-Type-Options "nosniff"  always;
    add_header X-Frame-Options        "DENY"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

    # ---- HTTP entry point -------------------------------------------------
    # Redirects everything to HTTPS once you have TLS configured. Until
    # then, this block just serves the same content over plain HTTP.
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;

        # ACME http-01 challenge passthrough (Certbot). Safe to leave on
        # even before you have TLS.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Uncomment after TLS is configured:
        # return 301 https://$host$request_uri;

        # Health probe passthrough so external monitors can hit the API
        # directly without going through the proxy.
        location = /health {
            proxy_pass http://opc_api/health;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes — anything NOT under `/_next/` and not `/` is treated
        # as an API request and forwarded to the Go service.
        location / {
            # Default: serve the web app.
            proxy_pass http://opc_web;
            proxy_http_version 1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ---- HTTPS entry point ------------------------------------------------
    # Uncomment and configure once you have certificates.
    #
    # server {
    #     listen      443 ssl http2;
    #     listen      [::]:443 ssl http2;
    #     server_name opc.example.com;
    #
    #     ssl_certificate     /etc/letsencrypt/live/opc.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/opc.example.com/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # HSTS — only after you're confident TLS will stay on.
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location /health {
    #         proxy_pass http://opc_api/health;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    #
    #     location / {
    #         proxy_pass http://opc_web;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection        "";
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 60s;
    #     }
    # }
}
